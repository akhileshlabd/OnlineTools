<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Free Qube - All Tools in One Place{% endblock %}</title>

    <!-- Meta for SEO -->
    <meta name="description" content="Free Qube: Free online PDF, image, and resume tools with no login or watermark." />
    <meta name="keywords" content="PDF tools, Image tools, Resume builder, merge PDF, resize image, no watermark" />

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />

    <!-- Canonical Link Block -->
    {% block canonical %}<link rel="canonical" href="{{ request.url }}">{% endblock %}
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo2.png') }}">

    {% block head %}{% endblock %}
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Header / Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm py-2">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="/">
                <img src="{{ url_for('static', filename='logo2.png') }}" alt="Free Qube Logo" height="32" class="me-2">
                <span class="fw-bold fs-5 text-primary">Free Qube</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto fs-6">
                    <li class="nav-item"><a class="nav-link fw-semibold px-3" href="/#pdf"><i class="fas fa-file-pdf text-danger me-1"></i> PDF</a></li>
                    <li class="nav-item"><a class="nav-link fw-semibold px-3" href="/#image"><i class="fas fa-image text-success me-1"></i> Image</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container my-4 flex-grow-1">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer Ad Container Placeholder -->
    <div class="container my-3 text-center ad-container" id="ad-footer" style="min-height: 90px;">
        <!-- Google AdSense Code will go here. Placed away from tools to avoid accidental clicks -->
    </div>

    <!-- Footer -->
    <footer class="bg-white py-4 mt-auto shadow-sm border-top">
        <div class="container text-center text-muted">
            <p class="mb-2">&copy; {{ year | default(2023) }} Free Qube. All rights reserved.</p>
            <p class="mb-0 fs-6">
                <a href="/about" class="text-decoration-none text-muted mx-2">About Us</a> | 
                <a href="/privacy" class="text-decoration-none text-muted mx-2">Privacy Policy</a> | 
                <a href="/terms" class="text-decoration-none text-muted mx-2">Terms of Service</a>
            </p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
