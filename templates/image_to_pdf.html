{% extends "base.html" %}

{% block title %}Image to PDF - Free Qube{% endblock %}

{% block content %}
<div class="tool-interface">
    <div class="text-center mb-4">
        <h2 class="fw-bold">JPG to PDF</h2>
        <p class="text-muted">Convert JPG, PNG, and GIF images to PDF in seconds. Easily adjust orientation and margins.</p>
    </div>

    <form method="POST" action="{{ url_for('pdf.image_to_pdf') }}" enctype="multipart/form-data">
        <div class="drag-drop-area mb-4" id="dropArea" onclick="document.getElementById('images').click()">
            <i class="fas fa-images"></i>
            <h4>Select Images</h4>
            <p class="text-muted mb-0">or drop images here</p>
            <input class="d-none" type="file" id="images" name="images" multiple accept="image/png, image/jpeg, image/jpg">
        </div>

        <div id="previewContainer" class="d-flex flex-wrap gap-3 mb-4 justify-content-center"></div>

        <div class="text-center">
            <button type="submit" class="btn btn-primary btn-lg rounded-pill px-5 fw-bold shadow-sm" id="convertBtn" style="display:none;">
                <i class="fas fa-file-pdf me-2"></i>Convert to PDF
            </button>
        </div>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
const imageInput = document.getElementById('images');
const previewContainer = document.getElementById('previewContainer');
const convertBtn = document.getElementById('convertBtn');
const dropArea = document.getElementById('dropArea');

dropArea.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropArea.classList.add('dragover');
});
dropArea.addEventListener('dragleave', () => {
    dropArea.classList.remove('dragover');
});
dropArea.addEventListener('drop', (e) => {
    e.preventDefault();
    dropArea.classList.remove('dragover');
    imageInput.files = e.dataTransfer.files;
    updatePreview();
});

imageInput.addEventListener('change', updatePreview);

function updatePreview() {
    previewContainer.innerHTML = '';
    const files = imageInput.files;
    
    if (files.length > 0) {
        convertBtn.style.display = 'inline-block';
        
        Array.from(files).forEach(file => {
            if(file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    img.className = 'img-thumbnail shadow-sm';
                    img.style.width = '100px';
                    img.style.height = '100px';
                    img.style.objectFit = 'cover';
                    previewContainer.appendChild(img);
                };
                reader.readAsDataURL(file);
            }
        });
    } else {
        convertBtn.style.display = 'none';
    }
}
</script>
{% endblock %}
